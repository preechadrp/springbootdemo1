#ทดสอบภาษาไทย
spring.application.name=springbootdemo1
#ถ้า thread ธรรมดาจะใช้แรมต่อ thread ประมาณ 1 MB ถ้าใช้ virtual thread จะใช้แรมต่อ thread ประมาณ 1 KB เท่านั้นสร้างได้หลักล้าน
spring.threads.virtual.enabled=true
#เอาไปประยุกต์ใช้กับโปรแกรมแบบ command
#spring.main.web-application-type=none

spring.datasource.url=jdbc:mariadb://localhost:3306/springbootdemo1
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver
spring.datasource.username=root
spring.datasource.password=a1234
spring.datasource.hikari.maximum-pool-size=3
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.auto-commit=true
spring.sql.init.mode=always
spring.jpa.hibernate.ddl-auto=create
spring.jpa.show-sql=true
# เปลี่ยนมาใช้ Physical Naming Strategy แบบ Standard เพื่อให้ใช้ชื่อตรงตามที่เราพิมพ์ในโค้ดเป๊ะๆ แต่มันจะมีผลกับทุก Entity เลยนะ
#spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandard

#custom properties
app.common.name=Spring Boot Demo 1
app.common.description=This is a Spring Boot Demo 1 application for testing custom properties.
app.common.version=1.0.0
app.common.db1-url=jdbc:mysql://localhost:3306/db1
app.common.db1-username=user1
app.common.db1-password=password1
#proxy settings
app.common.proxy-host=proxy.example.com
app.common.proxy-port=8080
app.common.proxy-username=proxyuser
app.common.proxy-password=proxypass
